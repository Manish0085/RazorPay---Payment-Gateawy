server:
  port: 8080
spring:
  application:
    name: payment-gateway


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razarpayDB}
    username: ${DB_USER:manish13}
    password: ${DB_PASSWORD:manish13}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true


payment:
  order:
    default-order-expiry-seconds: 600